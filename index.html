<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <script src="https://unpkg.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body { background-color: #030811; color: #00f0ff; font-family: 'Segoe UI', -apple-system, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #hud-container { text-align: center; z-index: 2; }
        h1 { font-size: 1.8rem; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 15px #00f0ff; margin-bottom: 5px; font-weight: 300; }
        #status { color: #8ab4f8; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 30px; text-transform: uppercase; }
        #jarvis-wave { width: 750px; height: 250px; filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5)); }
        #transcription { margin-top: 30px; max-width: 600px; color: #ffffff; font-size: 1.1rem; line-height: 1.6; min-height: 50px; padding: 15px; border-radius: 8px; background: rgba(0, 240, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.1); }
        #activation-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer; }
    </style>
</head>
<body>
    <div id="activation-overlay" onclick="startListening()"></div>
    <div id="hud-container">
        <h1>SISTEMA J.A.R.V.I.S.</h1>
        <div id="status">Pressione ESPAÇO ou Toque na tela para dar uma ordem...</div>
        <div id="jarvis-wave"></div>
        <div id="transcription">Aguardando comandos, senhor...</div>
    </div>
    <script>
        // O código vai buscar sua chave automaticamente de forma segura!
        const OPENAI_API_KEY = localStorage.getItem("jarvis_key") || "";

        let siriWave;
        try {
            siriWave = new SiriWave({
                container: document.getElementById('jarvis-wave'),
                width: 750, height: 250, style: 'ios9', amplitude: 0.1, speed: 0.04, color: '#00f0ff'
            });
        } catch(e) {}

        if(!OPENAI_API_KEY) {
            let key = prompt("Senhor, por favor insira sua chave da OpenAI (sk-...) para ativar meus sistemas:");
            if(key) { localStorage.setItem("jarvis_key", key); window.location.reload(); }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.onstart = () => {
                document.getElementById('status').innerText = "» OUVINDO SENHOR... «";
                if(siriWave) { siriWave.setAmplitude(1.6); siriWave.setSpeed(0.22); }
            };
            recognition.onresult = (event) => {
                const comandoTexto = event.results[0][0].transcript;
                document.getElementById('transcription').innerText = `"${comandoTexto}"`;
                enviarParaOpenAI(comandoTexto);
            };
            recognition.onerror = () => { resetJarvisVisual(); };
            recognition.onend = () => { resetJarvisVisual(); };
        }

        function startListening() { if (recognition) { try { recognition.start(); } catch(e) {} } }
        function resetJarvisVisual() {
            document.getElementById('status').innerText = "Pressione ESPAÇO ou Toque na tela para dar uma ordem...";
            if(siriWave) { siriWave.setAmplitude(0.1); siriWave.setSpeed(0.04); }
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); startListening(); } });

        async function enviarParaOpenAI(comando) {
            if (!comando.toLowerCase().includes("jarvis")) {
                document.getElementById('transcription').innerText = "Por favor, chame meu nome (Jarvis), senhor.";
                falar("Por favor, chame meu nome para que eu execute, senhor.");
                return;
            }
            document.getElementById('status').innerText = "» PROCESSANDO DADOS... «";
            try {
                const response = await fetch("https://openai.com", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${OPENAI_API_KEY}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "Você é o Jarvis. Responda em tom extremamente educado, britânico e trate o usuário como 'senhor'." },
                            { role: "user", content: comando }
                        ]
                    })
                });
                const data = await response.json();
                const respostaTexto = data.choices.message.content;
                document.getElementById('transcription').innerText = respostaTexto;
                falar(respostaTexto);
            } catch (error) {
                document.getElementById('transcription').innerText = "Falha de conexão com meus servidores centrais, senhor.";
            }
        }

        function falar(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.onstart = () => { if(siriWave) { siriWave.setAmplitude(1.0); siriWave.setSpeed(0.14); } };
            utterance.onend = () => { resetJarvisVisual(); };
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
