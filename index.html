
   <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA J.A.R.V.I.S.</title>
    <!-- Biblioteca das Ondas Holográficas -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #030811;
            color: #00f0ff;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #hud-container { text-align: center; z-index: 2; }
        h1 { font-size: 1.8rem; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 15px #00f0ff; margin-bottom: 5px; font-weight: 300; }
        #status { color: #8ab4f8; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 30px; text-transform: uppercase; }
        #jarvis-wave { width: 750px; height: 250px; filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5)); }
        #transcription { margin-top: 30px; max-width: 600px; color: #ffffff; font-size: 1.1rem; line-height: 1.6; min-height: 50px; padding: 15px; border-radius: 8px; background: rgba(0, 240, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.1); }
        #activation-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer; }
    </style>
</head>
<body>

    <div id="activation-overlay" onclick="startListening()"></div>

    <div id="hud-container">
        <h1>SISTEMA J.A.R.V.I.S.</h1>
        <div id="status">Pressione ESPAÇO ou Toque na tela para dar uma ordem...</div>
        <div id="jarvis-wave"></div>
        <div id="transcription">Aguardando ordens, senhor...</div>
    </div>

    <script>
        // O código agora guarda sua chave de forma limpa e automática na memória!
        const GEMINI_API_KEY = localStorage.getItem("jarvis_gemini_key") || "";

        let siriWave;
        try {
            siriWave = new SiriWave({
                container: document.getElementById('jarvis-wave'),
                width: 750, height: 250, style: 'ios9', amplitude: 0.1, speed: 0.04, color: '#00f0ff'
            });
        } catch(e) {}

        // Se você ainda não colou a chave, ele vai pedir em uma caixa na tela
        if(!GEMINI_API_KEY) {
            let key = prompt("Senhor, por favor insira sua chave do GOOGLE GEMINI para ativar meus sistemas:");
            if(key) { localStorage.setItem("jarvis_gemini_key", key); window.location.reload(); }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            
            recognition.onstart = () => {
                document.getElementById('status').innerText = "» OUVINDO SENHOR... «";
                if(siriWave) { siriWave.setAmplitude(1.6); siriWave.setSpeed(0.22); }
            };

            recognition.onresult = (event) => {
                const comandoTexto = event.results[0][0].transcript;
                document.getElementById('transcription').innerText = `"${comandoTexto}"`;
                enviarParaIA(comandoTexto);
            };

            recognition.onerror = () => { resetJarvisVisual(); };
            recognition.onend = () => { resetJarvisVisual(); };
        }

        function startListening() { if (recognition) { try { recognition.start(); } catch(e) {} } }
        
        function resetJarvisVisual() {
            document.getElementById('status').innerText = "Pressione ESPAÇO ou Toque na tela para dar uma ordem...";
            if(siriWave) { siriWave.setAmplitude(0.1); siriWave.setSpeed(0.04); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                startListening();
            }
        });

        // FUNÇÃO DE CONEXÃO DIRETA SEM PROXY
        async function enviarParaIA(comando) {
            if (!comando.toLowerCase().includes("jarvis")) {
                document.getElementById('transcription').innerText = "Por favor, inicie a frase chamando meu nome (Jarvis), senhor.";
                falar("Por favor, chame meu nome para que eu execute, senhor.");
                return;
            }

            document.getElementById('status').innerText = "» PROCESSANDO DADOS... «";

            try {
                // Link de conexão direta com o endpoint oficial do Gemini da Google
                const url = `https://googleapis.com{GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Você é o assistente virtual J.A.R.V.I.S. Responda em português, de forma extremamente refinada, inteligente, educada e sempre trate o usuário por 'senhor'. Responda de forma direta a seguinte pergunta de estudos: " + comando }] }]
                    })
                });

                const data = await response.json();
                const respostaTexto = data.candidates[0].content.parts[0].text;
                
                document.getElementById('transcription').innerText = respostaTexto;
                falar(respostaTexto);

            } catch (error) {
                document.getElementById('transcription').innerText = "Processando requisição, senhor. Por favor, verifique a validade de sua chave do Gemini.";
                falar("Sinto muito, senhor. Houve um impasse na validação da minha chave de acesso.");
            }
        }

        function falar(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.onstart = () => { if(siriWave) { siriWave.setAmplitude(1.0); siriWave.setSpeed(0.14); } };
            utterance.onend = () => { resetJarvisVisual(); };
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
